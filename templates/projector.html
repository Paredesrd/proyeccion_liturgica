<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salida de Proyección</title>
    <link rel="stylesheet" href="/static/css/projector.css">
</head>
<body>
    <!-- Capa 1: Fondo (Video o Imagen) -->
    <div id="background-layer" class="layer">
        <img id="bg-image" src="" alt="" style="display: none; width: 100%; height: 100%; object-fit: cover;">
        <video id="bg-video" loop playsinline style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
        <div id="bg-solid-color" style="width: 100%; height: 100%; background-color: #000;"></div>
    </div>

    <!-- Capa 2: Contenido Principal (Texto, Letras, Anuncios) -->
    <div id="content-layer" class="layer">
        <h1 id="main-title"></h1>
        <p id="main-text"></p>
        <div id="lyrics-container"></div>
        <div id="birthday-list"></div>
    </div>

    <!-- Capa 3: Audio (Música de fondo, efectos) -->
    <audio id="bg-audio" loop></audio>

    <!-- Capa 4: Overlay de Pantalla Negra -->
    <div id="blackout-layer" class="layer" style="display: none; background-color: #000; z-index: 999;"></div>

    <script src="/static/js/projector.js"></script>
</body>
</html>
