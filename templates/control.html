<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Litúrgico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/control.css?v=5">
</head>
<body class="vh-100 d-flex flex-column overflow-hidden bg-body-tertiary">
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3 flex-shrink-0">
        <span class="navbar-brand mb-0 h1 fw-bold">
            <span class="me-2">🎛️</span>Control de Proyección
        </span>
        <span id="connection-status" class="badge bg-danger p-2 fs-6">Desconectado</span>
    </nav>

    <div class="container-fluid flex-grow-1 overflow-hidden p-3">
        <div class="row h-100">

            <div class="col-lg-4 col-xl-3 d-flex flex-column h-100 overflow-y-auto pe-lg-3 mb-3 mb-lg-0">
                <h6 class="text-uppercase text-secondary fw-bold mb-3" style="letter-spacing: 1px;">Módulos del Sistema</h6>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="inicializacion" onclick="activateModule('inicializacion')">
                            <div class="fs-4 mb-1">⏱️</div><small class="fw-bold">Inicialización</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="alabanzas" onclick="activateModule('alabanzas')">
                            <div class="fs-4 mb-1">🎵</div><small class="fw-bold">Alabanzas</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="saludos" onclick="activateModule('saludos')">
                            <div class="fs-4 mb-1">👋</div><small class="fw-bold">Saludos</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="predica" onclick="activateModule('predica')">
                            <div class="fs-4 mb-1">🎤</div><small class="fw-bold">Prédica</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="biblia" onclick="activateModule('biblia')">
                            <div class="fs-4 mb-1">📖</div><small class="fw-bold">Biblia</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="cenia" onclick="activateModule('cenia')">
                            <div class="fs-4 mb-1">🍷</div><small class="fw-bold">Santa Cena</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="cumpleanos" onclick="activateModule('cumpleanos')">
                            <div class="fs-4 mb-1">🎂</div><small class="fw-bold">Cumpleaños</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="anuncios" onclick="activateModule('anuncios')">
                            <div class="fs-4 mb-1">📢</div><small class="fw-bold">Anuncios</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary w-100 h-100 p-2 module-btn" data-module="ofrendas" onclick="activateModule('ofrendas')">
                            <div class="fs-4 mb-1">💰</div><small class="fw-bold">Ofrendas</small>
                        </button>
                    </div>
                </div>

                <div class="card bg-dark border-secondary flex-grow-1">
                    <div class="card-header border-secondary py-3">
                        <h6 class="mb-0 fw-bold">Controles: <span id="active-module-name" class="text-info">Ninguno</span></h6>
                    </div>
                    <div class="card-body d-flex flex-column" id="dynamic-controls">
                        <p class="text-muted text-center mt-4">Seleccione un módulo para cargar las herramientas operativas.</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 col-xl-9 d-flex flex-column h-100">
                <div class="card bg-dark border-secondary flex-grow-1 mb-3">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">🖥️ Retorno de Proyección</h5>
                        <span class="badge text-bg-danger live-indicator">EN VIVO</span>
                    </div>
                    <div class="card-body p-3 d-flex align-items-center justify-content-center bg-black overflow-hidden">
                        <div class="ratio ratio-16x9 w-100 border border-secondary rounded shadow-lg" id="monitor-wrapper">
                            <iframe src="/projector?monitor=true" id="projector-monitor" scrolling="no" tabindex="-1" allow="autoplay"></iframe>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-3 flex-shrink-0">
                    <button class="btn btn-danger flex-grow-1 py-3 fw-bold fs-5 shadow-sm" onclick="sendCommand('blackout', {}, 'all'); const audio = document.getElementById('local-audio-engine'); if(audio) audio.pause();">
                        🔴 Corte a Negro (Emergencia)
                    </button>
                    <button class="btn btn-warning flex-grow-1 py-3 fw-bold fs-5 shadow-sm" onclick="sendCommand('clear', {}, 'all'); const audio = document.getElementById('local-audio-engine'); if(audio) audio.pause();">
                        🧹 Limpiar Pantalla
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MOTOR NATIVO DE REPRODUCCIÓN LOCAL DE AUDIO -->
    <audio id="local-audio-engine" loop style="display: none;"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/control.js?v=15"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wrapper = document.getElementById('monitor-wrapper');
            const iframe = document.getElementById('projector-monitor');

            if (wrapper && iframe) {
                const resizeObserver = new ResizeObserver(entries => {
                    const width = entries[0].contentRect.width;
                    const scale = width / 1280;
                    iframe.style.width = '1280px';
                    iframe.style.height = '720px';
                    iframe.style.transform = `scale(${scale})`;
                    iframe.style.transformOrigin = 'top left';
                });
                resizeObserver.observe(wrapper);
            }
        });
    </script>
</body>
</html>
