<div id="text-search-modal" class="ts-modal">
    <div class="ts-backdrop" onclick="window.closeTextSearch()"></div>
    <div class="ts-container">
        <div class="ts-header">
            <svg class="ts-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="ts-input" class="ts-input" placeholder="Busca por texto... (ej. 'con el corazón se cree')" autocomplete="off">
            <select id="ts-version" class="ts-version">
                <option value="RVR1960" selected>RVR1960</option><option value="NVI">NVI</option>
                <option value="NTV">NTV</option><option value="TLA">TLA</option><option value="NBLA">NBLA</option>
                <option value="DHHS94">DHHS94</option><option value="PDT">PDT</option>
                <option value="">Todas</option>
            </select>
            <button id="ts-close" class="ts-close" onclick="window.closeTextSearch()">&times;</button>
        </div>
        <div id="ts-results" class="ts-results"><div class="ts-empty">Escribe para buscar versículos por texto</div></div>
        <div class="ts-footer">
            <span><kbd>Esc</kbd> Cerrar</span><span><kbd>Enter</kbd> Proyectar</span><span><kbd>Ctrl+K</kbd> Abrir</span>
        </div>
    </div>
</div>
